aid: leadgenius
name: LeadGenius
description: >-
  LeadGenius provides precision B2B contact and account intelligence for go-to-market teams,
  combining machine learning with a global team of human researchers so every contact and account is
  human-verified before delivery. The company reports 400+ customers, coverage across 42 countries
  and 3 billion+ data records served, with products spanning contact behavioral intelligence,
  advanced contact tags, contact monitoring, social tracking, buying-committee coverage and privacy
  compliance. Its developer surface is the LeadGenius Enrichment API — a RESTful, API-key
  authenticated service documented at docs.leadgenius.com that supports company enrichment, contact
  enrichment and contact append, offered both as asynchronous Campaigns (create a campaign, upload up
  to 200 records per request, receive a record-finalized webhook, retrieve the enriched results) and
  as real-time "rapid enrichment" requests submitted and collected by id.
